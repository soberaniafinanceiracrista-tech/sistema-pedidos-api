version: '3.8'

services:
  db:
    image: postgres:15
    container_name: pedidos-db
    restart: always
    environment:
      POSTGRES_USER: user_pedidos
      POSTGRES_PASSWORD: password_pedidos
      POSTGRES_DB: pedidos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: pedidos-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      # Aqui está o segredo: o host do banco é o nome do serviço "db"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pedidos_db
      SPRING_DATASOURCE_USERNAME: user_pedidos
      SPRING_DATASOURCE_PASSWORD: password_pedidos
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  postgres_data:
